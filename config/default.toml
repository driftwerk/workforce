# Workforce Framework — Default Configuration
# Override with workforce.toml or WORKFORCE_* env vars.

[nats]
url = "nats://localhost:4222"     # comma-separated for clusters
connect_timeout_secs = 10
# max_reconnects = unlimited by default
# stream_replicas = 1             # 3 on a 3-node NATS cluster

[logging]
level = "info"
format = "pretty"  # pretty | json
