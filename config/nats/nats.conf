# NATS Server Configuration — Workforce Development

# Server name
server_name: workforce-hub

# Client connections
listen: 0.0.0.0:4222

# HTTP monitoring
http_port: 8222

# JetStream — persistent message streams
jetstream {
    store_dir: /data/jetstream
    max_mem: 256MB
    max_file: 5GB
}

# Leaf node connections (for distributed nodes)
leafnodes {
    listen: 0.0.0.0:7422
}

# Cluster routing (for future multi-node NATS)
# Uncomment when running multiple NATS nodes:
# cluster {
#     name: workforce
#     listen: 0.0.0.0:6222
# }

# Logging
debug: false
trace: false
logtime: true
