[package]
name = "workforce-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Fixtures other crates' tests build on: `JobLink` constructors that need no
# daemon, and the gated-turn fixtures in `tools::approval::testing`.
test-support = []
# S3-backed `ArtifactStore` for active-active hub deployments. Off by default so
# the standard build (filesystem store) needs no extra dependency.
s3 = ["dep:aws-sdk-s3"]

[dependencies]
workforce-core = { workspace = true }
workforce-common = { workspace = true }
workforce-nats = { workspace = true }
workforce-policy = { workspace = true }
workforce-sift = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
jsonschema = { workspace = true }
eyre = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
htmd = { workspace = true }
url = { workspace = true }
regex = { workspace = true }
ignore = { workspace = true }
once_cell = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
unicode-normalization = { workspace = true }

parking_lot = { workspace = true }
libc = "0.2"
toml = { workspace = true }
sha2 = "0.10"
rust_xlsxwriter = { workspace = true }
zip = { workspace = true }
rusqlite = { workspace = true }
lru = { workspace = true }
aws-sigv4 = { version = "1", default-features = false, features = ["http1", "sign-http"] }
aws-credential-types = "1"
aws-config = { version = "1", default-features = false, features = [
    "rt-tokio",
    "behavior-version-latest",
    "credentials-process",
    "default-https-client",
] }
aws-sdk-bedrock = { version = "1", default-features = false, features = [
    "rt-tokio",
    "default-https-client",
    "behavior-version-latest",
] }
# Optional S3 artifact-store backend (gated by the `s3` feature). aws-config /
# aws-credential-types are already unconditional deps (bedrock), so the feature
# only pulls in the S3 client; the hub builds the client and injects it.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "rt-tokio",
    "default-https-client",
    "behavior-version-latest",
], optional = true }
gcp_auth = "0.12"
thiserror = { workspace = true }
crc32fast = "1.4"
percent-encoding = "2"
bytes = { workspace = true }
tempfile = "3.25.0"
ttf-parser = "0.25"

# Direct database-access tools (database.*): Postgres family via tokio-postgres
# + deadpool pooling + rustls TLS; MySQL via mysql_async; CSV streaming export.
tokio-postgres = { workspace = true }
deadpool-postgres = { workspace = true }
tokio-postgres-rustls = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
mysql_async = { workspace = true }

# The remote runner link: mutual TLS between the hub and a worker host, with
# the peer's certificate common name as its identity.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
x509-cert = "0.2"
socket2 = { version = "0.5", features = ["all"] }
csv = { workspace = true }

# Inbound attachment processing (moved here from the hub so the edge reaches
# the same pipeline): docx is a zip of XML, spreadsheets and PDFs need readers.
quick-xml = { workspace = true }
calamine = { workspace = true }
pdf-extract = "0.12"

[dev-dependencies]
tokio = { workspace = true }
rcgen = "0.13"
wiremock = { workspace = true }
tracing-subscriber = { workspace = true }
quick-xml = { workspace = true }
