# Model pricing per million tokens (USD).
#
# To override: place a `pricing.toml` in your workspace root.
# OpenRouter prices are also fetched from their API at startup.
#
# Cache rates: `cache_read` and `cache_write` are optional. When omitted,
# cache tokens are billed at the regular `input` rate.
#  - Anthropic 5-minute ephemeral: cache_read = 0.10× input,
#    cache_write = 1.25× input.
#  - Gemini implicit caching: cache_read = 0.25× input (no separate write).
#  - Cerebras: caching is automatic with no discount — leave both unset.

[anthropic]
# Sonnet 5 stayed at its launch rate ($2/$10) past 2026-08-31; the 5.x rows
# match the AWS Pricing API's global rates and OpenRouter (checked 2026-10-19).
# Haiku 5.5 doubles to $0.50/$2.50 above 100K prompt tokens; the table holds
# one rate, so long prompts on it are understated.
"claude-fable-5-1"            = { input = 10.00, output = 50.00, cache_read = 0.25, cache_write = 12.50 }
