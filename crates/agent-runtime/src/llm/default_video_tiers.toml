# Video-generation model tier equivalences.
#
# Mirrors default_image_tiers.toml but for text/image->video generation. The
# `[llm.video].model` spec resolves against this table via the same
# `provider:tier` shorthand grammar (e.g. `veo:standard`).
#
# To override: place a `video_tiers.toml` in your workspace root with the
# sections you want to change; it is merged on top of these defaults.
#
# Google Veo via the Gemini API (generativelanguage, predictLongRunning). All
# tiers support text->video and image->video (a starting frame / subject ref).
# `standard` is the fast, verified default (~40s for an 8s 720p clip);
# `powerful` is the newest, highest-quality line (Veo 3.1, subject references).
# The Gemini API lists only the 3.1 family (2026-10-19); veo-3.0-fast is gone.
[veo]
powerful = "veo-3.1-generate-preview"
standard = "veo-3.1-fast-generate-preview"
cheap    = "veo-3.1-lite-generate-preview"
