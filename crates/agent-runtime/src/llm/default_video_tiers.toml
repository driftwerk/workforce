# Video-generation model tier equivalences.
#
# Mirrors default_image_tiers.toml but for text/image->video generation. The
# `[llm.video].model` spec resolves against this table via the same
# `provider:tier` shorthand grammar (e.g. `gemini:standard`).
#
# To override: place a `video_tiers.toml` in your workspace root with the
# sections you want to change; it is merged on top of these defaults.
#
# Gemini API video generation through the Interactions endpoint. Google
# withdrew every Veo model from the Gemini API in October 2026; Gemini Omni is
# the only video line it serves, so every tier names its one GA model until
# Google ships another. All tiers take text->video and image->video.
[gemini]
powerful = "gemini-omni-1.1-flash"
standard = "gemini-omni-1.1-flash"
cheap    = "gemini-omni-1.1-flash"
