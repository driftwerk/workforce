# Transcription model pricing.
#
# Layered on top of `default_pricing.toml` at startup so the unified pricing
# HashMap covers transcription models. Pricing for chat-multimodal paths
# (Gemini, OpenRouter+Google) is NOT repeated here — those models are already
# priced in `default_pricing.toml` / `default_vision_pricing.toml` and the
# audio call goes through the same per-token billing as text.
#
# ───────────────────────────────────────────────────────────────────────────
# Pricing convention for time-billed Whisper-style APIs
# ───────────────────────────────────────────────────────────────────────────
#
# Whisper APIs bill per audio-minute, not per token. To reuse the existing
# CostTracker.calculate_cost path we synthesise "tokens" from audio duration:
#
#     input_tokens = (duration_seconds * 1000) as u64    # 1 token = 1ms of audio
#
# That makes the per-million rate:
#
#     input_per_million = (USD per audio-minute / 60) * 1_000_000 / 1000
#                       = USD per audio-minute * 16.667
#
# Worked example (OpenAI whisper-1 @ $0.006/audio-min):
#
#     input_per_million = 0.006 * 16.667 ≈ 0.1
#
# So 600 seconds of audio (= 600_000 fake tokens) costs:
#
#     (600_000 / 1_000_000) * 0.1 = 0.06 USD
#
# which matches $0.006/min × 10 min exactly.
#
# Output tokens are always 0 — Whisper returns text without per-token billing.

[openai]
"whisper-1" = { input = 0.1, output = 0.0 }                # $0.006/audio-min

[groq]
"whisper-large-v3"           = { input = 0.185, output = 0.0 }  # $0.0111/audio-min
"whisper-large-v3-turbo"     = { input = 0.067, output = 0.0 }  # $0.0040/audio-min
"distil-whisper-large-v3-en" = { input = 0.033, output = 0.0 }  # $0.0020/audio-min

# vLLM and self-hosted Whisper run on user infrastructure — no per-minute
# cost. Listed in default_transcription_tiers.toml for capability detection
# only.
