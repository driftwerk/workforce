# Vision model pricing per million tokens (USD).
#
# Entries here are layered on top of `default_pricing.toml` at startup so that
# the unified pricing HashMap covers every model that can appear in vision
# routing. Models already priced in `default_pricing.toml` (Anthropic Claude,
# Gemini, GPT-5.x via OpenRouter) are NOT repeated here — they share rates
# with the text path.
#
# To override: add the same model keys to your workspace `pricing.toml`.

[openrouter.qwen-vl]
"qwen/qwen3-vl-235b-a22b-instruct" = { input = 0.20,  output = 0.88 }
"qwen/qwen3-vl-32b-instruct"       = { input = 0.104, output = 0.416 }
"qwen/qwen3-vl-8b-instruct"        = { input = 0.08,  output = 0.50 }
"qwen/qwen2.5-vl-72b-instruct"     = { input = 0.25,  output = 0.75 }

[openrouter.glm-v]
"z-ai/glm-5v-turbo" = { input = 1.20, output = 4.00 }
"z-ai/glm-4.6v"     = { input = 0.30, output = 0.90 }
"z-ai/glm-4.5v"     = { input = 0.60, output = 1.80 }

[zai-v]
"glm-4.6v" = { input = 0.30, output = 0.90 }
"glm-4.5v" = { input = 0.60, output = 1.80 }

# vLLM and Ollama vision models run on user infrastructure — no per-token cost.
# Listed in default_vision_tiers.toml for capability detection only.
