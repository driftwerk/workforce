[package]
name = "workforce-permissions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
workforce-policy = { workspace = true }
workforce-postgres = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
eyre = { workspace = true }
lru = { workspace = true }
parking_lot = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
refinery = { workspace = true, optional = true }

[features]
default = []
postgres = [
    "dep:tokio-postgres",
    "dep:deadpool-postgres",
    "dep:refinery",
    "workforce-postgres/postgres",
]

[dev-dependencies]
tempfile = "3"
tokio-test = { workspace = true }
workforce-postgres = { workspace = true, features = ["test-support"] }

[build-dependencies]
workforce-build-support = { path = "../build-support" }
