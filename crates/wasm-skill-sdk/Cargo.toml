[package]
name = "workforce-skill-sdk"
version = "0.1.5"
edition = "2021"
description = "SDK for building WASM-based skills for workforce agents"
license = "MIT"
repository = "https://github.com/driftwerk/workforce"
keywords = ["wasm", "agent", "skill", "workforce"]
categories = ["wasm"]

[lib]
crate-type = ["rlib"]

[dependencies]
base64 = "0.22.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
