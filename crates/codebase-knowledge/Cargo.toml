[package]
name = "workforce-codebase-knowledge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
workforce-core = { path = "../core" }
workforce-common = { path = "../common" }
workforce-postgres = { workspace = true }

# AST parsing
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-kotlin-ng = "1.1"

# Storage
rusqlite = { workspace = true }
reqwest = { workspace = true }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Core utilities
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5"] }
eyre = { workspace = true }
tracing = { workspace = true }
blake3 = { workspace = true }
regex = { workspace = true }

# vellev
vellev-client = { workspace = true }
vellev-core = { workspace = true }
vellev-index = { workspace = true }
workforce-vellev = { workspace = true }

# File traversal
ignore = "0.4"
glob = "0.3"
num_cpus = "1.16"

# Optional Postgres backend (Phase 3 of the multi-store migration roadmap).
tokio-postgres = { workspace = true, optional = true }
deadpool-postgres = { workspace = true, optional = true }
refinery = { workspace = true, optional = true }

[features]
default = []
postgres = [
    "dep:tokio-postgres",
    "dep:deadpool-postgres",
    "dep:refinery",
    "workforce-postgres/postgres",
]

[dev-dependencies]
tracing-subscriber = { workspace = true }
workforce-vellev = { workspace = true, features = ["testing"] }
tempfile = "3"
axum = { workspace = true }
tokio = { version = "1", features = ["full", "test-util"] }
workforce-postgres = { workspace = true, features = ["test-support"] }

[build-dependencies]
workforce-build-support = { path = "../build-support" }
