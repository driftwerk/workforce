[package]
name = "workforce-skills"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
workforce-core = { path = "../core" }
workforce-common = { path = "../common" }
workforce-agent = { path = "../agent-runtime" }

async-trait = "0.1"
base64 = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
parking_lot = { workspace = true }
regex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
toml = { workspace = true }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# Slack transport (behind feature flag)
reqwest = { workspace = true, optional = true }
tokio = { version = "1", features = ["sync", "time", "macros", "rt"], optional = true }
tokio-tungstenite = { version = "0.28", features = ["native-tls"], optional = true }
futures = { version = "0.3", optional = true }
lru = { workspace = true, optional = true }

# Microsoft Teams (Bot Framework — behind feature flag)
jsonwebtoken = { version = "10", optional = true }

# Email (behind feature flag)
async-imap = { workspace = true, optional = true }
async-native-tls = { workspace = true, optional = true }
mailparse = { workspace = true, optional = true }
htmd = { workspace = true, optional = true }
lettre = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }

# Google skill (pure-Rust OAuth2 + REST clients)
axum = { workspace = true, optional = true }
url = { workspace = true, optional = true }
sha2 = { version = "0.10", optional = true }
rand = { workspace = true, optional = true }
open = { version = "5", optional = true }
workforce-oauth-client = { workspace = true, optional = true }

# Browser (Obscura via CDP)
chromiumoxide = { version = "0.9", default-features = false, optional = true }

[features]
default = []
slack = ["reqwest", "tokio-tungstenite", "tokio", "futures", "lru", "pulldown-cmark"]
teams = ["reqwest", "tokio", "lru", "jsonwebtoken"]
github = ["reqwest", "tokio", "jsonwebtoken"]
google = ["tokio", "reqwest", "axum", "url", "sha2", "rand", "open", "lettre", "workforce-oauth-client"]
linear = ["reqwest", "tokio"]
jira = ["reqwest", "reqwest/multipart", "tokio", "pulldown-cmark"]
datadog = ["reqwest", "tokio"]
metabase = ["reqwest", "tokio"]
hubspot = ["reqwest", "tokio"]
notion = ["reqwest", "tokio"]
browser = ["tokio", "chromiumoxide", "futures", "sha2"]
obscura = ["tokio", "futures"]
email = ["tokio", "async-imap", "async-native-tls", "mailparse", "htmd", "futures", "lettre", "pulldown-cmark"]
postmark = ["reqwest", "tokio"]
sendgrid = ["reqwest", "tokio", "futures"]
xero = ["reqwest", "tokio", "futures", "sha2"]
freeagent = ["reqwest", "tokio", "futures", "workforce-oauth-client"]
spotify = ["reqwest", "tokio", "futures", "workforce-oauth-client"]

[dev-dependencies]
http = "1"
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
wiremock = "0.6"
