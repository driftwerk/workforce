[package]
name = "workforce-lessons"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[dependencies]
workforce-core = { path = "../core" }
workforce-common = { path = "../common" }
workforce-agent = { path = "../agent-runtime" }
workforce-memory = { path = "../memory" }

chrono = { version = "0.4", features = ["serde"] }
eyre = "0.6"
once_cell = { workspace = true }
regex = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
async-trait = "0.1"
parking_lot = { workspace = true }
