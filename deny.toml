# Dependency licence policy, checked by `cargo deny check licenses` in CI.
# Workforce itself is Elastic-2.0, so every dependency must be permissive (or,
# for MPL-2.0, file-level copyleft used unmodified). Dual-licensed crates that
# offer a GPL option are taken under their permissive option.

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "Elastic-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "PostgreSQL",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# webpki 0.22 ships an ISC-style LICENSE without a `license` field.
[[licenses.clarify]]
crate = "webpki"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

[licenses.private]
ignore = true
