[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/postgres",
    "crates/common",
    "crates/crypto",
    "crates/build-support",
    "crates/nats-bus",
    "crates/policy-engine",
    "crates/agent-runtime",
    "crates/orchestrator",
    "crates/playbook",
    "crates/lessons",
    "crates/decide",
    "crates/sift",
    "crates/memory",
    "crates/vellev",
    "crates/skills",
    "crates/distributed",
    "crates/pairing",
    "crates/identity",
    "crates/permissions",
    "crates/projects",
    "crates/hub",
    "crates/hub-core",
    "crates/games",
    "crates/desk",
    "crates/gateway-client",
    "crates/cli",
    "crates/codebase-knowledge",
    "crates/knowledge-service",
    "crates/local-mcp",
    "crates/wasm-runtime",
    "crates/wasm-skill-sdk",
    "crates/oauth-client",
    "crates/mcp-client",
    "crates/mcp-store",
    "crates/training",
    "crates/self-learning",
    "crates/worker",
]

[workspace.package]
version = "0.1.7"
edition = "2021"
license = "Elastic-2.0"
repository = "https://github.com/driftwerk/workforce"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42.0", features = ["macros", "rt-multi-thread", "sync", "time", "process", "fs", "io-util", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1.17"
async-trait = "0.1.85"
futures = "0.3.31"

# Web framework
axum = { version = "0.8.1", features = ["macros", "ws"] }
tower-http = { version = "0.6.2", features = ["cors", "trace"] }

# Serialisation
serde = { version = "1.0.217", features = ["derive"] }
# `float_roundtrip`: the default parser is off by an ULP on some literals
# (253.33333333333334 parses to …aac, not …aab), which breaks exact
# comparison of the diagram golden corpus against the widget.
serde_json = { version = "1.0.138", features = ["float_roundtrip"] }
serde_ignored = "0.1.14"
shlex = "1.3.0"
jsonschema = { version = "0.58", default-features = false }
serde_yaml = "0.9.34"
toml = "0.8.19"
toml_edit = "0.22"

# Error handling
eyre = "0.6.12"
color-eyre = "0.6.3"
thiserror = "2.0.11"

# Configuration
config = "0.15.7"

# NATS messaging
async-nats = "0.51"
bytes = "1.10.0"

# Database
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
deadpool = { version = "0.12.0", features = ["rt_tokio_1"] }
deadpool-postgres = "0.14.1"
refinery = { version = "0.8.12", features = ["tokio-postgres"] }
# TLS connector for tokio-postgres (sslmode=require) — pure-rust rustls/ring,
# matching workforce-postgres. Used by the direct database-access tools.
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# OS trust store for the opt-in TLS verify path (tls_verify=true).
rustls-native-certs = "0.7"
# MySQL / MariaDB driver for the direct database-access tools (rustls TLS).
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }

# Logging & tracing
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["fmt", "json", "env-filter"] }

# OpenTelemetry — used by `workforce-common` behind the `otel` feature so
# only the hub binary pays the compile-time cost. Versions match orbit
# for consistency across the driftwerk fleet.
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["rt-tokio", "logs"] }
opentelemetry-otlp = { version = "0.33", features = ["logs", "grpc-tonic"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-semantic-conventions = "0.33"
tracing-opentelemetry = "0.34"

# Metrics — Prometheus-style emission via the `metrics` facade so the
# hub can expose /metrics for in-cluster scrapers while still honouring the
# `tracing::info!` log-based pipeline a Datadog integration uses.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }

# Sentry — opt-in via SENTRY_DSN env var; no-op when unset.
sentry = { version = "0.49", default-features = false, features = ["reqwest", "rustls", "backtrace", "contexts", "panic"] }
sentry-tracing = "0.49"

# OpenAPI
utoipa = { version = "5.3.1", features = ["axum_extras", "uuid"] }
utoipa-swagger-ui = { version = "9.0.0", features = ["axum"] }

# Common utilities
uuid = { version = "1.12.1", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4.39", features = ["serde"] }
strum = { version = "0.26.3", features = ["derive"] }
strum_macros = "0.26.4"
reqwest = { version = "0.12.12", features = ["json", "stream", "multipart"] }
htmd = "0.1"
url = "2.5"
itertools = "0.14.0"
parking_lot = "0.12.3"
once_cell = "1.20.2"
regex = "1.11.1"
ignore = "0.4"
lru = "0.18"
base64 = "0.22.0"
unicode-normalization = "0.1"

# CLI
clap = { version = "4.5.27", features = ["derive", "env"] }
dialoguer = "0.11.0"
indicatif = "0.17.9"
console = "0.15.10"

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tui-textarea = "0.7"
pulldown-cmark = "0.12"
unicode-width = "0.2"

# Crypto
blake3 = "1.6.0"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"

# vellev
vellev-client = "0.1"
vellev-core = "0.1"
vellev-index = "0.1"
workforce-vellev = { path = "crates/vellev" }

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }

# Workspace crates
workforce-core = { path = "crates/core" }
workforce-postgres = { path = "crates/postgres" }
workforce-common = { path = "crates/common" }
workforce-crypto = { path = "crates/crypto" }
workforce-nats = { path = "crates/nats-bus" }
workforce-policy = { path = "crates/policy-engine" }
workforce-sift = { path = "crates/sift" }
workforce-agent = { path = "crates/agent-runtime" }
workforce-gateway-client = { path = "crates/gateway-client" }
workforce-pairing = { path = "crates/pairing" }
workforce-projects = { path = "crates/projects" }
workforce-worker = { path = "crates/worker" }
workforce-wasm-runtime = { path = "crates/wasm-runtime" }
workforce-skill-sdk = { path = "crates/wasm-skill-sdk" }
workforce-oauth-client = { path = "crates/oauth-client" }
workforce-mcp-client = { path = "crates/mcp-client" }
workforce-mcp-store = { path = "crates/mcp-store" }
workforce-training = { path = "crates/training" }
workforce-self-learning = { path = "crates/self-learning" }

# WASM runtime
wasmtime = "36.0.19"
semver = "1"

# Dev / testing
tokio-test = "0.4.4"
mockall = "0.13.1"
wiremock = "0.6.2"
testcontainers-modules = { version = "0.11.6", features = ["postgres", "nats"] }
fake = { version = "3.1.0", features = ["derive"] }

# Document parsing
csv = "1.3"
calamine = { version = "0.26", features = ["dates"] }
# Spreadsheet writing (xlsx export). calamine is read-only; this is the writer.
rust_xlsxwriter = "0.79"
# `default-features = false` drops the `lzma` feature which pulls in
# `liblzma-sys`. liblzma-sys conflicts (via the cargo `links` mechanism)
# with `lzma-sys` that ends up in the tree through other deps such as
# `postgresql_embedded`'s archive extractor in the test build. The hub
# only uses `zip` to read .docx attachments, which are deflate-only.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
quick-xml = "0.41"

# Email (for workforce-skills email feature)
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"] }
mailparse = "0.15"

[profile.dev]
debug = 0
