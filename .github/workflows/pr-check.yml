name: PR Check

# Runs on every pull request and on main. Everything here runs on
# GitHub-hosted runners with a read-only token and no repository secrets:
# a pull request can run its own code here, so nothing here may be able to
# publish, deploy or read anything private. Building and deploying releases
# happens elsewhere, from merged commits only.

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

env:
  # vite's MDX UI build needs more than Node's ~2GB default old-space.
  NODE_OPTIONS: --max-old-space-size=6144
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  POSTGRESQL_VERSION: "=17.9.0"
  # The vellev node the `vellev-node` job tests against, by digest so a
  # re-pushed tag can't change what is tested.
  VELLEV_IMAGE: kingsleyh/vellev:sha-ada7a63ef132d18049d3c7342f6076a249a69979@sha256:e2e1d95ba0b733737a03ac6ebf47119e6356e8b6f49eb03fe1aa2de5a72ca080
  # The Weaviate the `vellev-node` job runs the memory shadow's end-to-end
  # test against, as Weaviate's release archive for linux-amd64, pinned by
  # the sha256 Weaviate publishes beside it. Moving it is these two lines.
  WEAVIATE_VERSION: "1.28.4"
  WEAVIATE_SHA256: 0892f23d1802872ddca3a7c489fe9eab17c76de3dc1058d21d51d3f741aa9a18

jobs:
  # A change outside end-user-docs/ is code and runs the full gate; a
  # docs-only change runs just the tests that read the embedded pages.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "docs=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          code=false; docs=false
          if grep -qvE '^end-user-docs/' <<<"$changed"; then code=true; fi
          if grep -qE '^end-user-docs/' <<<"$changed"; then docs=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # Known secret formats in what a pull request or push adds. A required
  # check through CI OK.
  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          case "$RANGE" in 0000000000000000000000000000000000000000..*) RANGE=${RANGE#*..} ;; esac
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts="$RANGE" .

  ui:
    name: UI
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Type-check, test and build
        run: |
          npm --prefix ui ci
          (cd ui && npx tsc --noEmit)
          npm --prefix ui test
          npm --prefix ui run build

  fmt:
    name: Format
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: cargo fmt --all -- --check

  licenses:
    name: Dependency licences
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny check licenses

  clippy:
    name: Clippy
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # The embedded-Postgres build script calls the GitHub API; the job's own
      # read-only token keeps it off the anonymous rate limit.
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all-targets --all-features --no-deps -- -D warnings

  # The hub test suite is built once here and run in parallel partitions
  # below (`test-run`), with the doctests in their own job (`test-doc`).
  # Together they run exactly what one `cargo nextest run --all-features`
  # plus `cargo test --all-features --doc` ran; `test-count` fails the
  # run if the partitions' tests don't add up to every test in the archive.
  test-build:
    name: Test build
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WORKFORCE_SKIP_POSTGRES_TESTS: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest
      # The hub's build script creates ui/dist when it is absent, which makes
      # the directory newer than the script's last run and so rebuilds the
      # hub (and what depends on it) on every later cargo command. Create it
      # first so each crate is built once.
      - run: mkdir -p ui/dist
      - name: Build every test binary
        run: cargo nextest archive --all-features --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst"
      # Every test the archive holds that a plain run would run (not
      # #[ignore]d), for `test-count` to hold the partitions to.
      - name: Count the tests
        run: |
          set -euo pipefail
          cargo nextest list --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" --workspace-remap . --message-format json \
            | jq '[.["rust-suites"][].testcases | to_entries[] | select(.value.ignored == false and .value["filter-match"].status == "matches")] | length' \
            > "$RUNNER_TEMP/expected-tests"
          echo "tests to run: $(cat "$RUNNER_TEMP/expected-tests")"
          cp "$RUNNER_TEMP/expected-tests" expected-tests
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}/nextest-archive.tar.zst
          # Already zstd-compressed.
          compression-level: 0
          retention-days: 1
          overwrite: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: expected-tests
          path: expected-tests
          retention-days: 1
          overwrite: true
          if-no-files-found: error

  test-run:
    name: Test (${{ matrix.partition }}/6)
    needs: [changes, test-build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    env:
      WORKFORCE_SKIP_POSTGRES_TESTS: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      # The checkout is for the files tests read at run time (fixtures,
      # docs, migrations); the binaries come from the archive. It sits at
      # the same path as in `test-build`, which is what the paths compiled
      # into the tests expect.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-nextest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive
          path: ${{ runner.temp }}
      - run: mkdir -p ui/dist
      - name: Run partition ${{ matrix.partition }} of 6
        run: |
          cargo nextest run --archive-file "$RUNNER_TEMP/nextest-archive.tar.zst" --workspace-remap . \
            --partition count:${{ matrix.partition }}/6 --profile ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 1
          overwrite: true
          if-no-files-found: warn

  # Fails unless the partitions together ran every test in the archive, so a
  # partition that is dropped from the matrix, or that runs nothing, can't
  # shrink the suite unseen.
  test-count:
    name: Test count
    needs: [test-build, test-run]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: junit-*
          path: parts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: expected-tests
          path: parts/expected-tests
      - run: |
          set -euo pipefail
          want="$(cat parts/expected-tests/expected-tests)"
          total=0
          for f in parts/junit-*/junit.xml; do
            n="$(grep -o -m1 '<testsuites [^>]*' "$f" | grep -o ' tests="[0-9]*"' | grep -o '[0-9]*')"
            echo "$f: $n tests"
            total=$((total + n))
          done
          echo "partitions ran $total tests; the archive holds $want"
          if [ "$total" != "$want" ]; then
            echo "::error::the partitions ran $total tests, the archive holds $want"
            exit 1
          fi

  test-doc:
    name: Doctests
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      WORKFORCE_SKIP_POSTGRES_TESTS: "1"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          save-if: false
      - run: mkdir -p ui/dist
      - run: cargo test --all-features --doc

  # The tests that need a real vellev node and Postgres. Elsewhere these skip
  # themselves; VELLEV_TEST_REQUIRED makes a skip a failure here, so a green
  # job means they ran.
  vellev-node:
    name: vellev node tests (${{ matrix.leg }})
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    # Two legs on two runners, each with its own node: the hub's tests (one
    # long compile) beside the other crates' tests, instead of one after the
    # other. Between them they run what the single job ran.
    strategy:
      fail-fast: false
      matrix:
        leg: [crates, hub]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vellev
          POSTGRES_PASSWORD: vellev
          POSTGRES_DB: vellev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vellev" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      VELLEV_TEST_KEY: ci-key
      VELLEV_TEST_LOCAL_EMBED: "1"
      VELLEV_TEST_REQUIRED: "1"
      # The tests that need a Weaviate fail without one rather than skip:
      # a skipped test passes, and would count among the node tests that
      # `vellev-node-tests.sh` requires to have run and passed.
      WORKFORCE_TEST_WEAVIATE_REQUIRED: "1"
      VELLEV_TEST_URL: http://127.0.0.1:8080
      WORKFORCE_TEST_POSTGRES_URL: postgres://vellev:vellev@127.0.0.1:5432/vellev
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: vellev-node
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.leg == 'hub' }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/vellev-models
          key: vellev-models-bge-base-en-v1.5
      - name: Start a vellev node
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # The image runs as its own user; give it writable host directories
          # for its store and cache, and the cached models.
          mkdir -p ~/vellev-models "$RUNNER_TEMP/vellev-data"
          chmod 0777 ~/vellev-models "$RUNNER_TEMP/vellev-data"
          docker run -d --name vellev --network host \
            -e VELLEV_LISTEN=127.0.0.1:8080 \
            -e VELLEV_DATABASE_URL=postgres://vellev:vellev@127.0.0.1:5432/vellev \
            -e VELLEV_STORE=file:///data/store \
            -e VELLEV_CACHE_DIR=/data/cache \
            -e VELLEV_MODEL_DIR=/models \
            -e VELLEV_API_KEYS="$VELLEV_TEST_KEY" \
            -v "$RUNNER_TEMP/vellev-data:/data" \
            -v "$HOME/vellev-models:/models" \
            "$VELLEV_IMAGE" serve
          for _ in $(seq 1 120); do
            curl -fsS -o /dev/null "$VELLEV_TEST_URL/health/ready" && ready=1 && break
            sleep 1
          done
          if [ "${ready:-}" != 1 ]; then docker logs vellev | tail -n 100; exit 1; fi
          # Embed once so the model download isn't charged to a test's timeout.
          call() { curl -sS -H "authorization: Bearer $VELLEV_TEST_KEY" -H 'content-type: application/json' "$@"; }
          probe="$VELLEV_TEST_URL/v1/tenants/ci-probe"
          call -f -X PUT "$probe"
          call -f -X PUT "$probe/collections/Probe" -d '{"name":"Probe","properties":[{"name":"text","data_type":"text"}],"embedding":{"provider":"local","model":"BAAI/bge-base-en-v1.5","dimensions":768,"properties":["text"]}}'
          for _ in $(seq 1 90); do
            code=$(call -o /dev/null -w '%{http_code}' -X PUT "$probe/collections/Probe/objects/00000000-0000-0000-0000-000000000001" -d '{"properties":{"text":"warm up"}}')
            [ "$code" = 200 ] && embeds=1 && break
            sleep 10
          done
          call -X DELETE "$probe" || true
          if [ "${embeds:-}" != 1 ]; then docker logs vellev | tail -n 100; exit 1; fi
      # A Weaviate, for the memory shadow's end-to-end test, which moves
      # memories from one. Its release binary, pinned by sha256 (see
      # WEAVIATE_SHA256). The collection memories are moved from names the
      # `text2vec-transformers` module, so the module
      # is on; nothing is vectorized by Weaviate here, so its inference
      # service is a stand-in that answers only what Weaviate asks of it at
      # start: `/.well-known/ready`, and `/meta`.
      - name: Start Weaviate
        timeout-minutes: 10
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/weaviate"
          mkdir -p "$work"
          free_port() {
            python3 -c 'import socket; s = socket.socket(); s.bind(("127.0.0.1", 0)); print(s.getsockname()[1]); s.close()'
          }
          # Two free ports in a row: Weaviate's cluster data port must be
          # the one after its gossip port. Prints the first.
          free_pair() {
            python3 -c '
          import socket
          for _ in range(100):
              a = socket.socket(); a.bind(("127.0.0.1", 0)); port = a.getsockname()[1]
              b = socket.socket()
              try:
                  b.bind(("127.0.0.1", port + 1))
              except OSError:
                  continue
              finally:
                  a.close(); b.close()
              print(port); break
          else:
              raise SystemExit("no two free ports in a row")
          '
          }
          weaviate="$(.github/scripts/fetch-weaviate-binary.sh "$WEAVIATE_VERSION" "$WEAVIATE_SHA256" "$work/weaviate-bin")"

          stub="$work/inference"
          mkdir -p "$stub/.well-known"
          : > "$stub/.well-known/ready"
          echo '{}' > "$stub/meta"
          stubport="$(free_port)"
          nohup python3 -m http.server "$stubport" --bind 127.0.0.1 --directory "$stub" \
            > "$work/inference.log" 2>&1 &
          echo $! > "$work/inference.pid"
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null "http://127.0.0.1:$stubport/.well-known/ready" && stubbed=1 && break
            sleep 1
          done
          if [ "${stubbed:-}" != 1 ]; then
            cat "$work/inference.log"
            echo "::error::the inference stand-in never answered"
            exit 1
          fi

          port="$(free_port)"
          gossip="$(free_pair)"
          env \
            PERSISTENCE_DATA_PATH="$work/weaviate-data" \
            AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=true \
            DEFAULT_VECTORIZER_MODULE=none \
            ENABLE_MODULES=text2vec-transformers \
            TRANSFORMERS_INFERENCE_API="http://127.0.0.1:$stubport" \
            DISABLE_TELEMETRY=true \
            CLUSTER_HOSTNAME=node1 \
            CLUSTER_ADVERTISE_ADDR=127.0.0.1 \
            CLUSTER_GOSSIP_BIND_PORT="$gossip" \
            CLUSTER_DATA_BIND_PORT="$((gossip + 1))" \
            RAFT_PORT="$(free_port)" \
            RAFT_INTERNAL_RPC_PORT="$(free_port)" \
            RAFT_BOOTSTRAP_EXPECT=1 \
            GRPC_PORT="$(free_port)" \
            nohup "$weaviate" --host 127.0.0.1 --port "$port" --scheme http \
            > "$work/weaviate.log" 2>&1 &
          echo $! > "$work/weaviate.pid"
          url="http://127.0.0.1:$port"
          for _ in $(seq 1 120); do
            curl -fsS -o /dev/null "$url/v1/.well-known/ready" && ready=1 && break
            kill -0 "$(cat "$work/weaviate.pid")" 2>/dev/null || break
            sleep 1
          done
          if [ "${ready:-}" != 1 ]; then
            tail -n 100 "$work/weaviate.log"
            echo "::error::Weaviate never became ready"
            exit 1
          fi
          # The version asked for, with the module on.
          meta="$(curl -fsS "$url/v1/meta")"
          python3 - "$meta" "$WEAVIATE_VERSION" <<'PY'
          import json, sys
          meta, want = json.loads(sys.argv[1]), sys.argv[2]
          if meta.get("version") != want:
              sys.exit(f"::error::Weaviate says it is {meta.get('version')}, not {want}")
          module = meta.get("modules", {}).get("text2vec-transformers")
          if module is None:
              sys.exit("::error::Weaviate has no text2vec-transformers module")
          # Weaviate starts with a module whose inference service it could
          # not ask, and says so only here.
          if "error" in module:
              sys.exit(f"::error::Weaviate's text2vec-transformers module: {module['error']}")
          PY
          echo "Weaviate $WEAVIATE_VERSION at $url"
          echo "WORKFORCE_TEST_WEAVIATE_URL=$url" >> "$GITHUB_ENV"
      # See test-build: the hub's build script makes ui/dist, and the
      # directory is newer than its last run, so without this every cargo
      # command rebuilds the hub.
      - run: mkdir -p ui/dist
      - name: Run the tests against the node
        timeout-minutes: 60
        env:
          LEG: ${{ matrix.leg }}
        run: |
          set -euo pipefail
          if [ "$LEG" = crates ]; then
            cargo test --all-features \
              -p workforce-vellev \
              -p workforce-memory \
              -p workforce-codebase-knowledge \
              -p workforce-knowledge-service
            cargo test --all-features -p workforce-orchestrator --lib -- artifact_store
          else
            crates/hub/vellev-node-tests.sh --all-features
          fi
      - name: Node logs
        if: always()
        run: docker logs vellev 2>&1 | tail -n 200 || true
      - name: Stop Weaviate
        if: always()
        run: |
          work="$RUNNER_TEMP/weaviate"
          for name in weaviate inference; do
            [ -f "$work/$name.pid" ] && kill "$(cat "$work/$name.pid")" 2>/dev/null || true
          done
          [ -f "$work/weaviate.log" ] && tail -n 50 "$work/weaviate.log" || true

  docs-embed:
    name: Docs embed
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.code != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: test
          save-if: false
      - run: cargo test -p workforce-hub --lib -- remote_mcp::help

  # The one check branch protection requires: path- and lane-skipped jobs
  # never report, so this always does, and fails if anything that ran failed.
  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, secrets, ui, fmt, licenses, clippy, test-build, test-run, test-count, test-doc, vellev-node, docs-embed]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a required job ended: $r"; exit 1 ;; esac
          done
